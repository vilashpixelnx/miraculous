<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
	<defs>
		<linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5A4460"/>
			<stop offset=".5" stop-color="#2E2232"/>
			<stop offset="1" stop-color="#17101A"/>
		</linearGradient>
		<linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#3A2B40"/>
			<stop offset="1" stop-color="#1E1622"/>
		</linearGradient>
		<linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FF8FA3"/>
			<stop offset=".5" stop-color="#FD374B"/>
			<stop offset="1" stop-color="#C21E3A"/>
		</linearGradient>
		<linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FFE9A0"/>
			<stop offset="1" stop-color="#F0A230"/>
		</linearGradient>
		<filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<ellipse cx="100" cy="166" rx="64" ry="7" fill="#2A0A1E" opacity=".4" filter="url(#blur)"/>
	<!-- sleeves -->
	<path d="M62 34L24 56l14 30 22-10z" fill="url(#sleeve)"/>
	<path d="M138 34l38 22-14 30-22-10z" fill="url(#sleeve)"/>
	<path d="M24 56l14 30" stroke="#6E5674" stroke-width="3" stroke-linecap="round" opacity=".6"/>
	<!-- body -->
	<path d="M62 34c10 10 66 10 76 0l2 4v118c0 4-3 6-7 6H67c-4 0-7-2-7-6V38z" fill="url(#shirt)"/>
	<!-- collar -->
	<path d="M76 30c6 14 42 14 48 0" fill="none" stroke="#6E5674" stroke-width="6" stroke-linecap="round"/>
	<path d="M76 30c6 10 42 10 48 0" fill="#120C15"/>
	<!-- M logo -->
	<path d="M78 112V78l22 22 22-22v34h-10V98l-12 12-12-12v14z" fill="url(#logo)"/>
	<path d="M78 78l22 22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45"/>
	<!-- price tag -->
	<path d="M140 104l26-8 8 24-26 8z" fill="url(#tag)"/>
	<circle cx="146" cy="108" r="3" fill="#8A5208"/>
	<path d="M146 108c-6-8-6-20 0-26" fill="none" stroke="#D9A040" stroke-width="2" stroke-linecap="round"/>
	<!-- highlight -->
	<path d="M70 50v52" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".18"/>
</svg>
