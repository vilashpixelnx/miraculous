<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
	<defs>
		<radialGradient id="vinyl" cx=".5" cy=".5" r=".5">
			<stop offset="0" stop-color="#3A2A30"/>
			<stop offset=".7" stop-color="#1E1418"/>
			<stop offset="1" stop-color="#120B0E"/>
		</radialGradient>
		<radialGradient id="label" cx=".4" cy=".35" r=".7">
			<stop offset="0" stop-color="#FFD1E8"/>
			<stop offset="1" stop-color="#E0407E"/>
		</radialGradient>
		<linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#F5C6FF"/>
			<stop offset=".5" stop-color="#B566E8"/>
			<stop offset="1" stop-color="#6A27B8"/>
		</linearGradient>
		<filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<ellipse cx="100" cy="166" rx="70" ry="7" fill="#3A1780" opacity=".35" filter="url(#blur)"/>
	<!-- record sliding out -->
	<circle cx="122" cy="88" r="62" fill="url(#vinyl)"/>
	<g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"><circle cx="122" cy="88" r="54"/><circle cx="122" cy="88" r="46"/><circle cx="122" cy="88" r="38"/></g>
	<circle cx="122" cy="88" r="20" fill="url(#label)"/>
	<circle cx="122" cy="88" r="3.5" fill="#120B0E"/>
	<!-- sleeve -->
	<g transform="rotate(-8 70 96)">
		<rect x="18" y="38" width="108" height="112" rx="8" fill="url(#sleeve)"/>
		<path d="M40 112c14-30 44-40 70-30" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
		<circle cx="50" cy="66" r="12" fill="#fff" opacity=".35"/>
		<rect x="18" y="38" width="108" height="112" rx="8" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>
	</g>
</svg>
