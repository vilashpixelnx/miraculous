<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
	<defs>
		<linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#F0C8FF"/>
			<stop offset=".35" stop-color="#A866F2"/>
			<stop offset="1" stop-color="#4B22B0"/>
		</linearGradient>
		<radialGradient id="cupL" cx=".32" cy=".28" r=".85">
			<stop offset="0" stop-color="#F2CFFF"/>
			<stop offset=".35" stop-color="#B271F5"/>
			<stop offset=".75" stop-color="#6A2FD6"/>
			<stop offset="1" stop-color="#3A158F"/>
		</radialGradient>
		<radialGradient id="cupR" cx=".62" cy=".28" r=".85">
			<stop offset="0" stop-color="#E9BDFF"/>
			<stop offset=".35" stop-color="#A25FF0"/>
			<stop offset=".75" stop-color="#5E28C8"/>
			<stop offset="1" stop-color="#321283"/>
		</radialGradient>
		<radialGradient id="pad" cx=".5" cy=".4" r=".7">
			<stop offset="0" stop-color="#5B3A9E"/>
			<stop offset=".7" stop-color="#2A1460"/>
			<stop offset="1" stop-color="#170A3A"/>
		</radialGradient>
		<linearGradient id="yoke" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#7C45DE"/>
			<stop offset=".5" stop-color="#D7A6FF"/>
			<stop offset="1" stop-color="#6A33CC"/>
		</linearGradient>
		<filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<ellipse cx="100" cy="166" rx="74" ry="8" fill="#3A1780" opacity=".35" filter="url(#blur)"/>
	<!-- headband -->
	<path d="M40 112C34 34 166 34 160 112" fill="none" stroke="#3A158F" stroke-width="19" stroke-linecap="round"/>
	<path d="M40 112C34 34 166 34 160 112" fill="none" stroke="url(#band)" stroke-width="15" stroke-linecap="round"/>
	<path d="M46 86C52 46 148 46 154 86" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45"/>
	<!-- yokes -->
	<rect x="33" y="96" width="14" height="22" rx="5" fill="url(#yoke)"/>
	<rect x="153" y="96" width="14" height="22" rx="5" fill="url(#yoke)"/>
	<!-- left cup -->
	<ellipse cx="42" cy="128" rx="25" ry="34" fill="url(#cupL)"/>
	<ellipse cx="54" cy="128" rx="15" ry="29" fill="url(#pad)"/>
	<ellipse cx="57" cy="128" rx="9" ry="22" fill="#12072E" opacity=".55"/>
	<ellipse cx="32" cy="112" rx="7" ry="14" fill="#fff" opacity=".4" transform="rotate(-12 32 112)"/>
	<!-- right cup -->
	<ellipse cx="158" cy="128" rx="25" ry="34" fill="url(#cupR)"/>
	<ellipse cx="146" cy="128" rx="15" ry="29" fill="url(#pad)"/>
	<ellipse cx="143" cy="128" rx="9" ry="22" fill="#12072E" opacity=".55"/>
	<ellipse cx="166" cy="110" rx="5" ry="11" fill="#fff" opacity=".32" transform="rotate(12 166 110)"/>
</svg>
