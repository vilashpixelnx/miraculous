<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
	<defs>
		<linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#A8185C"/>
			<stop offset=".45" stop-color="#FFD0E4"/>
			<stop offset="1" stop-color="#B91E66"/>
		</linearGradient>
		<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FFE0EE"/>
			<stop offset=".45" stop-color="#F0559E"/>
			<stop offset="1" stop-color="#8E1248"/>
		</linearGradient>
		<radialGradient id="head" cx=".35" cy=".3" r=".85">
			<stop offset="0" stop-color="#FFE6F2"/>
			<stop offset=".35" stop-color="#F772B0"/>
			<stop offset=".8" stop-color="#C02273"/>
			<stop offset="1" stop-color="#6E0B3B"/>
		</radialGradient>
	</defs>
	<!-- beam -->
	<path d="M52 22l96-20v26l-96 20z" fill="#6E0B3B"/>
	<path d="M52 18l96-20v24l-96 20z" fill="url(#beam)"/>
	<path d="M58 22l84-17" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
	<!-- stems -->
	<rect x="48" y="20" width="11" height="90" rx="5" fill="url(#stem)"/>
	<rect x="137" y="2" width="11" height="90" rx="5" fill="url(#stem)"/>
	<!-- heads -->
	<ellipse cx="34" cy="112" rx="27" ry="20" fill="url(#head)" transform="rotate(-20 34 112)"/>
	<ellipse cx="123" cy="94" rx="27" ry="20" fill="url(#head)" transform="rotate(-20 123 94)"/>
	<ellipse cx="25" cy="103" rx="10" ry="5" fill="#fff" opacity=".65" transform="rotate(-26 25 103)"/>
	<ellipse cx="114" cy="85" rx="10" ry="5" fill="#fff" opacity=".65" transform="rotate(-26 114 85)"/>
</svg>
