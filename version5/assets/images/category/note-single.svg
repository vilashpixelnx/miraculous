<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140">
	<defs>
		<linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#C21E3F"/>
			<stop offset=".45" stop-color="#FFC2CC"/>
			<stop offset="1" stop-color="#D3264A"/>
		</linearGradient>
		<linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FFD6DE"/>
			<stop offset=".45" stop-color="#FD646D"/>
			<stop offset="1" stop-color="#B8183A"/>
		</linearGradient>
		<radialGradient id="head" cx=".35" cy=".3" r=".85">
			<stop offset="0" stop-color="#FFE4EA"/>
			<stop offset=".35" stop-color="#FF7A86"/>
			<stop offset=".8" stop-color="#E02A4A"/>
			<stop offset="1" stop-color="#8E0F2A"/>
		</radialGradient>
	</defs>
	<!-- flag -->
	<path d="M66 10c10 10 34 16 40 36 4 14-2 26-10 32 4-14-2-26-30-32z" fill="#8E0F2A"/>
	<path d="M64 6c10 10 34 16 40 36 4 14-2 26-10 32 4-14-2-26-30-32z" fill="url(#flag)"/>
	<path d="M70 14c10 8 22 12 28 22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>
	<!-- stem -->
	<rect x="58" y="6" width="12" height="100" rx="5" fill="url(#stem)"/>
	<!-- head -->
	<ellipse cx="44" cy="108" rx="30" ry="22" fill="#8E0F2A" transform="rotate(-20 44 108)" opacity=".5"/>
	<ellipse cx="42" cy="104" rx="30" ry="22" fill="url(#head)" transform="rotate(-20 42 104)"/>
	<ellipse cx="32" cy="94" rx="12" ry="6" fill="#fff" opacity=".65" transform="rotate(-26 32 94)"/>
</svg>
