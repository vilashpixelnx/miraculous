<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
	<defs>
		<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#F4F7FF"/>
			<stop offset=".45" stop-color="#A9B6CC"/>
			<stop offset="1" stop-color="#5D6A82"/>
		</linearGradient>
		<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#9CD2FF"/>
			<stop offset=".4" stop-color="#3D7BEA"/>
			<stop offset="1" stop-color="#1A3B9C"/>
		</linearGradient>
		<linearGradient id="plateEdge" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#1C3E9E"/>
			<stop offset=".5" stop-color="#5C95F2"/>
			<stop offset="1" stop-color="#16328A"/>
		</linearGradient>
		<filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<ellipse cx="100" cy="160" rx="80" ry="8" fill="#1A2F7A" opacity=".35" filter="url(#blur)"/>
	<g transform="rotate(-20 100 92)">
		<!-- bar -->
		<rect x="20" y="84" width="160" height="16" rx="8" fill="url(#bar)"/>
		<rect x="30" y="86" width="140" height="3" rx="1.5" fill="#fff" opacity=".7"/>
		<!-- grip -->
		<rect x="70" y="82" width="60" height="20" rx="8" fill="#2B3446"/>
		<path d="M76 82v20M84 82v20M92 82v20M100 82v20M108 82v20M116 82v20M124 82v20" stroke="#4A5670" stroke-width="2"/>
		<!-- left plates -->
		<rect x="30" y="44" width="22" height="96" rx="9" fill="url(#plateEdge)"/>
		<rect x="26" y="44" width="22" height="96" rx="9" fill="url(#plate)"/>
		<rect x="52" y="56" width="14" height="72" rx="6" fill="url(#plate)"/>
		<rect x="30" y="52" width="6" height="40" rx="3" fill="#fff" opacity=".5"/>
		<!-- right plates -->
		<rect x="134" y="56" width="14" height="72" rx="6" fill="url(#plate)"/>
		<rect x="152" y="44" width="22" height="96" rx="9" fill="url(#plateEdge)"/>
		<rect x="148" y="44" width="22" height="96" rx="9" fill="url(#plate)"/>
		<rect x="152" y="52" width="6" height="40" rx="3" fill="#fff" opacity=".5"/>
	</g>
</svg>
