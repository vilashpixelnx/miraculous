<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190">
	<defs>
		<radialGradient id="dcFace" cx=".34" cy=".25" r=".95">
			<stop offset="0" stop-color="#FFFFFF"/>
			<stop offset=".45" stop-color="#FFF0F2"/>
			<stop offset=".8" stop-color="#FFC9D0"/>
			<stop offset="1" stop-color="#F59AA6"/>
		</radialGradient>
		<linearGradient id="dcEdge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#F7A7B0"/>
			<stop offset="1" stop-color="#E2505E"/>
		</linearGradient>
		<linearGradient id="dcArrow" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FF8A95"/>
			<stop offset=".55" stop-color="#FE4E5C"/>
			<stop offset="1" stop-color="#D9364A"/>
		</linearGradient>
		<filter id="dcBlur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<!-- floor shadow -->
	<ellipse cx="100" cy="176" rx="62" ry="7" fill="#B8344A" opacity=".35" filter="url(#dcBlur)"/>
	<!-- cloud: depth layer, then glossy face -->
	<path d="M52 134c-22 0-38-16-38-36 0-19 14-34 33-36 5-25 27-42 53-42 24 0 45 15 52 37 21 2 36 19 36 40 0 21-17 37-38 37z" fill="url(#dcEdge)"/>
	<path d="M54 126c-20 0-35-14-35-32 0-17 13-31 31-32 5-23 25-39 50-39 23 0 42 14 48 35 19 2 33 17 33 36 0 18-15 32-34 32z" fill="url(#dcFace)"/>
	<!-- shine -->
	<path d="M62 52c-9 5-13 14-12 22" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".95"/>
	<circle cx="80" cy="40" r="5" fill="#fff"/>
	<!-- coral download arrow, dropping out of the cloud -->
	<path d="M90 66h24v52h22l-34 40-34-40h22z" fill="#C92E42" opacity=".35" transform="translate(2 3)"/>
	<path d="M90 66h24v52h22l-34 40-34-40h22z" fill="url(#dcArrow)"/>
	<path d="M97 74v40" stroke="#fff" stroke-width="4.5" stroke-linecap="round" opacity=".55"/>
	<!-- sparkles -->
	<path d="M176 26l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"/>
	<path d="M22 148l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff" opacity=".9"/>
	<circle cx="20" cy="40" r="3" fill="#fff" opacity=".85"/>
</svg>
