<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190">
	<defs>
		<radialGradient id="hcFace" cx=".34" cy=".28" r=".9">
			<stop offset="0" stop-color="#FFFFFF"/>
			<stop offset=".45" stop-color="#FFF0F2"/>
			<stop offset=".8" stop-color="#FFC9D0"/>
			<stop offset="1" stop-color="#F59AA6"/>
		</radialGradient>
		<linearGradient id="hcEdge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#F7A7B0"/>
			<stop offset="1" stop-color="#E2505E"/>
		</linearGradient>
		<linearGradient id="hcCoral" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FF8A95"/>
			<stop offset=".55" stop-color="#FE4E5C"/>
			<stop offset="1" stop-color="#D9364A"/>
		</linearGradient>
		<filter id="hcBlur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<!-- floor shadow -->
	<ellipse cx="100" cy="176" rx="56" ry="7" fill="#B8344A" opacity=".35" filter="url(#hcBlur)"/>
	<!-- rewind ring around the clock (coral arc with arrow head) -->
	<path d="M42 64A68 68 0 1 1 34 112" fill="none" stroke="#C92E42" stroke-width="12" stroke-linecap="round" opacity=".35" transform="translate(2 3)"/>
	<path d="M42 64A68 68 0 1 1 34 112" fill="none" stroke="url(#hcCoral)" stroke-width="12" stroke-linecap="round"/>
	<path d="M20 50l34 4-18 28z" fill="url(#hcCoral)"/>
	<!-- clock: depth layer, then glossy face -->
	<circle cx="102" cy="96" r="52" fill="url(#hcEdge)"/>
	<circle cx="100" cy="92" r="50" fill="url(#hcFace)"/>
	<!-- ticks -->
	<g fill="#F59AA6">
		<rect x="98" y="50" width="4" height="10" rx="2"/>
		<rect x="98" y="124" width="4" height="10" rx="2"/>
		<rect x="58" y="90" width="10" height="4" rx="2"/>
		<rect x="132" y="90" width="10" height="4" rx="2"/>
	</g>
	<!-- hands -->
	<path d="M100 92V64" stroke="url(#hcCoral)" stroke-width="8" stroke-linecap="round"/>
	<path d="M100 92l22 14" stroke="url(#hcCoral)" stroke-width="8" stroke-linecap="round"/>
	<circle cx="100" cy="92" r="8" fill="#FE4E5C"/>
	<circle cx="98" cy="90" r="3" fill="#fff" opacity=".8"/>
	<!-- shine -->
	<path d="M66 70c-5 8-6 17-3 25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".95"/>
	<circle cx="78" cy="58" r="4.5" fill="#fff"/>
	<!-- sparkles -->
	<path d="M178 22l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"/>
	<circle cx="184" cy="150" r="3" fill="#fff" opacity=".85"/>
</svg>
