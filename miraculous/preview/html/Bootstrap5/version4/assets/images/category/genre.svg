<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
	<defs>
		<linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#B0185E"/>
			<stop offset=".45" stop-color="#FFD6EA"/>
			<stop offset="1" stop-color="#C2257A"/>
		</linearGradient>
		<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FFE3F1"/>
			<stop offset=".45" stop-color="#F0559E"/>
			<stop offset="1" stop-color="#9C1557"/>
		</linearGradient>
		<radialGradient id="head" cx=".35" cy=".3" r=".85">
			<stop offset="0" stop-color="#FFE6F3"/>
			<stop offset=".35" stop-color="#F772B0"/>
			<stop offset=".8" stop-color="#C02273"/>
			<stop offset="1" stop-color="#7E0E45"/>
		</radialGradient>
		<filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<ellipse cx="100" cy="168" rx="66" ry="7" fill="#3A1780" opacity=".35" filter="url(#blur)"/>
	<!-- beam -->
	<path d="M74 40l92-22v26l-92 22z" fill="#7E0E45"/>
	<path d="M74 36l92-22v24l-92 22z" fill="url(#beam)"/>
	<path d="M80 40l80-19" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
	<!-- stems -->
	<rect x="70" y="40" width="12" height="96" rx="5" fill="url(#stem)"/>
	<rect x="154" y="18" width="12" height="96" rx="5" fill="url(#stem)"/>
	<!-- note heads -->
	<ellipse cx="58" cy="138" rx="28" ry="21" fill="url(#head)" transform="rotate(-18 58 138)"/>
	<ellipse cx="142" cy="116" rx="28" ry="21" fill="url(#head)" transform="rotate(-18 142 116)"/>
	<ellipse cx="48" cy="128" rx="11" ry="6" fill="#fff" opacity=".6" transform="rotate(-24 48 128)"/>
	<ellipse cx="132" cy="106" rx="11" ry="6" fill="#fff" opacity=".6" transform="rotate(-24 132 106)"/>
</svg>
