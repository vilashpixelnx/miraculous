<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190">
	<defs>
		<radialGradient id="lhHeart" cx=".34" cy=".28" r=".9">
			<stop offset="0" stop-color="#FFFFFF"/>
			<stop offset=".4" stop-color="#FFF0F2"/>
			<stop offset=".78" stop-color="#FFC9D0"/>
			<stop offset="1" stop-color="#F59AA6"/>
		</radialGradient>
		<linearGradient id="lhEdge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#F7A7B0"/>
			<stop offset="1" stop-color="#E2505E"/>
		</linearGradient>
		<linearGradient id="lhNote" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FF8A95"/>
			<stop offset=".55" stop-color="#FE4E5C"/>
			<stop offset="1" stop-color="#D9364A"/>
		</linearGradient>
		<radialGradient id="lhHead" cx=".35" cy=".3" r=".8">
			<stop offset="0" stop-color="#FFC2C8"/>
			<stop offset=".4" stop-color="#FE5E6B"/>
			<stop offset="1" stop-color="#C92E42"/>
		</radialGradient>
		<filter id="lhBlur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<!-- floor shadow -->
	<ellipse cx="100" cy="176" rx="58" ry="7" fill="#B8344A" opacity=".35" filter="url(#lhBlur)"/>
	<!-- heart: depth layer, then glossy face -->
	<path d="M100 166C46 128 16 100 16 66c0-25 19-44 43-44 18 0 32 10 41 26 9-16 23-26 41-26 24 0 43 19 43 44 0 34-30 62-84 100z" fill="url(#lhEdge)"/>
	<path d="M100 158C48 122 20 96 20 64c0-23 17-40 39-40 17 0 31 10 41 25 10-15 24-25 41-25 22 0 39 17 39 40 0 32-28 58-80 94z" fill="url(#lhHeart)"/>
	<!-- shine -->
	<path d="M44 46c-12 9-15 25-9 37" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
	<circle cx="62" cy="40" r="5.5" fill="#fff"/>
	<!-- coral music note in the middle -->
	<path d="M108 58c8 7 22 11 26 24 2 9-1 16-6 20 2-9-2-16-20-20z" fill="#C92E42" opacity=".35" transform="translate(2 3)"/>
	<path d="M108 58c8 7 22 11 26 24 2 9-1 16-6 20 2-9-2-16-20-20z" fill="url(#lhNote)"/>
	<rect x="102" y="56" width="8" height="64" rx="3.5" fill="url(#lhNote)"/>
	<ellipse cx="94" cy="121" rx="19" ry="14" fill="url(#lhHead)" transform="rotate(-20 94 121)"/>
	<ellipse cx="88" cy="115" rx="7" ry="3.6" fill="#fff" opacity=".7" transform="rotate(-26 88 115)"/>
	<!-- sparkles -->
	<path d="M170 20l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff"/>
	<path d="M24 132l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff" opacity=".9"/>
	<circle cx="182" cy="62" r="3" fill="#fff" opacity=".85"/>
</svg>
