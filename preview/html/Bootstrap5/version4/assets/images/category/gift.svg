<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180">
	<defs>
		<linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FFC2D6"/>
			<stop offset=".5" stop-color="#F56C9A"/>
			<stop offset="1" stop-color="#C02A62"/>
		</linearGradient>
		<linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#C83A6E"/>
			<stop offset="1" stop-color="#8E1A48"/>
		</linearGradient>
		<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#C21E3A"/>
			<stop offset=".5" stop-color="#FF6A7E"/>
			<stop offset="1" stop-color="#B0172F"/>
		</linearGradient>
		<filter id="blur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
	</defs>
	<ellipse cx="100" cy="166" rx="66" ry="7" fill="#7A0F38" opacity=".4" filter="url(#blur)"/>
	<!-- box -->
	<path d="M40 84h88v76H40z" fill="url(#box)"/>
	<path d="M128 84l34-12v74l-34 14z" fill="url(#side)"/>
	<!-- lid -->
	<path d="M32 66h100v22H32z" fill="url(#box)"/>
	<path d="M132 66l36-12v22l-36 12z" fill="url(#side)"/>
	<path d="M32 66l36-12h100l-36 12z" fill="#FFD6E4"/>
	<!-- ribbons -->
	<rect x="74" y="66" width="18" height="94" fill="url(#ribbon)"/>
	<path d="M140 63l14-5v96l-14 6z" fill="#A0142C"/>
	<path d="M74 66l36-12h18l-36 12z" fill="#FF8A9A"/>
	<!-- bow -->
	<path d="M100 56c-26-30-56-14-34 2 10 7 24 4 34-2z" fill="url(#ribbon)"/>
	<path d="M100 56c22-34 58-22 38 0-10 9-26 6-38 0z" fill="url(#ribbon)"/>
	<ellipse cx="100" cy="56" rx="10" ry="8" fill="#E2304A"/>
